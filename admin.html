body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  margin: 0;
  color: white;
}

.dashboard {
  padding: 20px;
}

/* NAV */
.nav-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.tab {
  background: #1e293b;
  border: none;
  color: #cbd5e1;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#031b34;
  min-height:100vh;
  overflow-x:hidden;
  color:white;
  padding:20px;
  position:relative;
}

/* =========================
BACKGROUND EFFECT
========================= */

.bg-overlay{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,255,255,.08), transparent 120px),
    radial-gradient(circle at 80% 20%, rgba(0,255,255,.08), transparent 120px),
    radial-gradient(circle at 50% 80%, rgba(0,255,255,.08), transparent 120px),
    linear-gradient(
      180deg,
      #03213f,
      #04284c,
      #03213f
    );
  z-index:-1;
}

/* =========================
CONTAINER
========================= */

.container{
  width:100%;
  max-width:700px;
  margin:auto;
}

/* =========================
HEADER
========================= */

.top-header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.header-left{
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
}

.header-center h1{
  font-size:28px;
  color:white;
  margin-bottom:4px;
}

.header-center span{
  color:#9cb7d1;
  font-size:14px;
}

/* =========================
NAVIGATION
========================= */

.nav-btn{
  height: 48px;
  border-radius: 16px;
  border: none;
  background: #0d2741;
  color: #b7c9dc;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.nav-tabs::-webkit-scrollbar{
  display:none;
}

.nav-btn{
  border:none;
  background:#16385d;
  color:#cddfff;
  padding:15px 22px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
}

.nav-btn.active{
  background:linear-gradient(
    135deg,
    #25f0d0,
    #1ca6ff
  );
  color:#001b2e;
}

/* =========================
FILTERS
========================= */

.filter-row{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  overflow:auto;
  padding-bottom:5px;
}

.filter-row::-webkit-scrollbar{
  display:none;
}

.filter-btn,
.country-btn{
  border:none;
  background:#17385d;
  color:#d6e7ff;
  padding:13px 20px;
  border-radius:18px;
  cursor:pointer;
  white-space:nowrap;
  font-weight:bold;
}

.filter-btn.active,
.country-btn.active{
  background:linear-gradient(
    135deg,
    #20f0d0,
    #1dbeff
  );
  color:#04213d;
}

/* =========================
SEARCH
========================= */

.search-box{
  background:#121f28;
  border-radius:18px;
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.search-box i{
  color:#8ba8c5;
}

.search-box input{
  width:100%;
  border:none;
  background:none;
  outline:none;
  color:white;
  font-size:16px;
}

.search-box input::placeholder{
  color:#8ba8c5;
}

/* =========================
DELETE PENDING
========================= */

.delete-pending-btn{
  border:none;
  background:#d96fd4;
  color:white;
  width:100%;
  padding:18px;
  border-radius:18px;
  margin-bottom:24px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
RECEIPT CARD
========================= */

.receipt-card{
  background:#102638;
  border-radius:28px;
  padding:20px;
  margin-bottom:28px;
  box-shadow:
    0 10px 25px rgba(0,0,0,.25);
}

/* =========================
CARD HEADER
========================= */

.receipt-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.user-info h2{
  font-size:24px;
  margin-bottom:8px;
}

.user-info p{
  color:#9db5cb;
  margin-bottom:5px;
  font-size:15px;
}

.status-badge{
  padding:12px 18px;
  border-radius:14px;
  font-size:14px;
  font-weight:bold;
  height:fit-content;
}

.pending{
  background:#184638;
  color:#4cff9a;
}

.approved{
  background:#0d3d57;
  color:#44d3ff;
}

.rejected{
  background:#4c1616;
  color:#ff7070;
}

/* =========================
COUPON
========================= */

.coupon-label{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#173e32;
  color:#52ffb3;
  padding:10px 14px;
  border-radius:14px;
  font-size:14px;
  margin-bottom:15px;
}

.coupon-box{
  background:#1c2b35;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  position:relative;
}

.coupon-title{
  color:#96aec4;
  margin-bottom:8px;
}

.coupon-code{
  font-size:32px;
  font-weight:bold;
  letter-spacing:2px;
  color:white;
}

.copy-btn{
  position:absolute;
  top:18px;
  right:18px;
  background:none;
  border:none;
  color:#31ffc5;
  font-size:22px;
  cursor:pointer;
}

/* =========================
IMAGE
========================= */

.image-wrapper{
  width:100%;
  height:420px;
  border-radius:24px;
  overflow:hidden;
  background:#0b1720;
  display:flex;
  align-items:center;
  justify-content:center;
}

.receipt-image{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* =========================
BUTTONS
========================= */

.action-row{
  display:flex;
  gap:12px;
  margin-top:24px;
}

button{
  font-weight:bold;
}

.approve-btn,
.reject-btn{
  flex:1;
  border:none;
  padding:18px;
  border-radius:18px;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.approve-btn{
  background:linear-gradient(
    135deg,
    #14d65c,
    #0aa74a
  );
}

.reject-btn{
  background:linear-gradient(
    135deg,
    #ff4d4d,
    #c70000
  );
}

.delete-btn{
  width:100%;
  border:none;
  margin-top:16px;
  background:black;
  color:#ff4d4d;
  padding:18px;
  border-radius:18px;
  font-size:17px;
  cursor:pointer;
}

/* =========================
EMPTY
========================= */

.empty-state{
  text-align:center;
  padding:60px 20px;
  color:#9db5cb;
  font-size:18px;
}

/* =========================
LOADER
========================= */

.loader{
  width:55px;
  height:55px;
  border:5px solid rgba(255,255,255,.1);
  border-top:5px solid #1ef2cf;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:60px auto;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:768px){

  body{
    padding:14px;
  }

  .header-center h1{
    font-size:24px;
  }

  .receipt-top{

  }

  .user-info h2{
    font-size:21px;
  }

  .coupon-code{
    font-size:24px;
  }

  .image-wrapper{
    height:320px;
  }

  .action-row{
    flex-direction:column;
  }

  .approve-btn,
  .reject-btn,
  .delete-btn{
    width:100%;
  }

}

.tabs{

}

/* GRID */

}

/* COLORS */
.blue { background:#ffd700; }
.green { background:#ffd700; }
.red { background: #ffd700; }
.orange { background:#ffd700; }

/* TEXT */
.card-number {

  font-weight: bold;
}

.card-title {
  font-size: 13px;
  color: #94a3b8;
}
</style>
</head>
<body>

<div class="dashboard">

  <!-- NAV -->
  <div class="nav-tabs">
    <button class="tab active" onclick="window.location='admin.html'"><i class="fas fa-chart-line"></i> Dashboard</button>

<script>
// =============================
// PARSE CONFIG
// =============================

Parse.initialize(
'MTLDbgDiz5KBGgnGUxe8bT0VLY0AsLtaneLWXgBl',
'YZQ1G7SQynyxlpTHiQqWrJHucigFFKhFwPSkgRaI'
);

Parse.serverURL =
'https://parseapi.back4app.com/';



// =============================
// AUTH CHECK
// =============================

async function verifyAdmin(){

const user = Parse.User.current();

if(!user){
alert('Login required');
window.location.href = 'login.html';
return;
}

const isAdmin = user.get('isAdmin');

if(!isAdmin){
alert('Unauthorized');
window.location.href = 'index.html';
return;
}

loadDashboard();

}


// =============================
// LOAD DASHBOARD
// =============================

async function loadDashboard(){

try{

document.body.classList.add('loading');

const data =
await Parse.Cloud.run(
'getAdminDashboardStats'
);

// =========================
// UPDATE UI
// =========================

document.getElementById(
'totalUsers'
).innerText = data.totalUsers;


document.getElementById(
'activeToday'
).innerText = data.activeToday;


document.getElementById(
'approvedReceipts'
).innerText = data.approvedReceipts;


document.getElementById(
'pendingReceipts'
).innerText = data.pendingReceipts;


document.getElementById(
'rejectedReceipts'
).innerText = data.rejectedReceipts;


document.getElementById(
'activeMiners'
).innerText = data.activeMiners;


document.getElementById(
'pushSubscribers'
).innerText = data.pushSubscribers;


renderChart(data.signups);

}catch(error){

console.log(error);
alert(error.message || error);

}

finally{

document.body.classList.remove('loading');

}

}


// =============================
// CHART
// =============================

function renderChart(signups){

const chart =
document.getElementById(
'chartContainer'
);

chart.innerHTML = '';

const max = Math.max(...signups, 10);

signups.forEach((value,index)=>{

const wrap =
document.createElement('div');

wrap.className = 'bar-wrap';

const bar =
document.createElement('div');

bar.className = 'bar';

const height =
(value / max) * 170;

bar.style.height =
height + 'px';

const text =
document.createElement('div');

text.className = 'bar-value';

text.innerText = value;

const date =
document.createElement('div');

const d = new Date();

d.setDate(
d.getDate() - (13 - index)
);

const label =
String(d.getDate())
.padStart(2,'0');


date.className = 'bar-value';

date.innerText = label;

wrap.appendChild(bar);
wrap.appendChild(text);
wrap.appendChild(date);

chart.appendChild(wrap);

});

}


verifyAdmin();
</script>
