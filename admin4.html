<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Admin Panel</title>

<style>
        /* admin.css */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    background:#081b29;
    color:white;
    min-height:100vh;
    padding:20px;
}

.app{
    max-width:700px;
    margin:auto;
}

.topbar{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.logo-wrap{
    display:flex;
    align-items:center;
    gap:12px;
}

.shield{
    width:48px;
    height:48px;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #24e5c2,
        #1f7cff
    );
}

.topbar h1{
    font-size:32px;
    font-weight:700;
}

.nav{
    display:flex;
    gap:12px;
    margin-bottom:25px;
    overflow:auto;
}

.nav-btn{
    border:none;
    background:#102b42;
    color:#8fa5bb;
    padding:14px 22px;
    border-radius:30px;
    cursor:pointer;
    min-width:120px;
    font-size:15px;
}

.nav-btn.active{
    background:#18d2c0;
    color:white;
}

.search-wrap{
    display:flex;
    gap:14px;
    margin-bottom:25px;
}

.search-wrap input{
    flex:1;
    background:#10283d;
    border:none;
    height:58px;
    border-radius:18px;
    padding:0 20px;
    color:white;
    font-size:17px;
}

.search-wrap input::placeholder{
    color:#60758c;
}

.export-btn{
    border:none;
    background:#10283d;
    color:white;
    padding:0 20px;
    border-radius:10px;
    cursor:pointer;
}

.user-card{
    background:#0f2436;
    border-radius:28px;
    padding:26px;
    margin-bottom:22px;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

.user-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:22px;
}

.user-name{
    font-size:28px;
    font-weight:700;
    margin-bottom:8px;
}

.user-email{
    color:#8ea2b5;
    margin-bottom:6px;
    word-break:break-word;
}

.last-seen{
    color:#6c8197;
    font-size:14px;
}

.active-badge{
    background:#1dd18d;
    color:white;
    padding:10px 18px;
    border-radius:14px;
    font-size:14px;
    font-weight:600;
}

.balance-box{
    background:#132c40;
    border-radius:24px;
    padding:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.balance-title{
    color:#9eb1c3;
    margin-bottom:10px;
}

.balance{
    color:#1dd18d;
    font-size:34px;
    font-weight:700;
}

.edit-btn{
    border:none;
    background:transparent;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.settings{
    margin-top:10px;
}

.setting-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.setting-title{
    font-size:20px;
    margin-bottom:4px;
}

.setting-desc{
    color:#72879c;
    font-size:14px;
}

.toggle{
    width:58px;
    height:32px;
    border-radius:40px;
    background:#0a1117;
    position:relative;
    cursor:pointer;
    transition:.3s;
}

.toggle.active{
    background:#19d7c4;
}

.toggle-circle{
    width:24px;
    height:24px;
    border-radius:50%;
    background:white;
    position:absolute;
    top:4px;
    left:4px;
    transition:.3s;
}

.toggle.active .toggle-circle{
    left:30px;
}

.action-buttons{
    margin-top:24px;
}

.action-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:18px;
    margin-bottom:14px;
    color:white;
    font-size:18px;
    cursor:pointer;
    font-weight:600;
}

.lock-btn{
    background:#ef3b44;
}

.bottom-actions{
    display:flex;
    gap:14px;
}

.ban-btn{
    flex:1;
    background:#9c2c36;
}

.delete-btn{
    flex:1;
    background:#ef3b44;
}

@media(max-width:600px){

    .user-name{
        font-size:22px;
    }

    .balance{
        font-size:28px;
    }

    .setting-title{
        font-size:16px;
    }

}

.nav-tabs{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:18px;
}

.tab{
height:48px;
border-radius:16px;
border:none;
background:#0d2741;
color:#b7c9dc;
font-size:13px;
font-weight:600;
cursor:pointer;
}

.tab.active{
background:linear-gradient(90deg,#1dd7a1,#2b72ff);
color:white;
}

</style>

<script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

</head>

<body>

<div class="app">

    <!-- TOP BAR -->

    <div class="topbar">

        <div class="logo-wrap">

            <div class="shield"></div>

            <h1>Admin Panel</h1>

        </div>

    </div>


    <!-- NAV -->

  <div class="nav-tabs">
    <button class="tab" onclick="window.location='admin.html'"><i class="fas fa-chart-line"></i> Dashboard</button>
    <button class="tab" onclick="window.location='admin2.html'"><i class="fas fa-receipt"></i> Receipts</button>
    <button class="tab active" onclick="window.location='admin4.html'"><i class="fas fa-users"></i> Users</button>
    <button class="tab" onclick="window.location='admin5.html'"><i class="fas fa-comments"></i> Chat</button>
    <button class="tab" onclick="window.location='admin6.html'"><i class="fas fa-bell"></i> Notify</button>
    <button class="tab" onclick="window.location='admin7.html'"><i class="fas fa-image"></i> image</button>
    <button class="tab" onclick="window.location='admin8.html'"><i class="fas fa-gear"></i> settings</button>
    <button class="tab" onclick="window.location='home.html'"><i class="fas fa-house"></i> home</button>
  </div>


    <!-- SEARCH -->

    <div class="search-wrap">

        <input
            type="text"
            id="searchInput"
            placeholder="Search user..."
        />

        <button class="export-btn">
            Export
        </button>

    </div>


    <!-- USERS -->

    <div id="usersContainer">

    </div>

</div>

<script>
        // admin.js

// ===============================
// PARSE INIT
// ===============================
 
Parse.initialize(
'MTLDbgDiz5KBGgnGUxe8bT0VLY0AsLtaneLWXgBl',
'YZQ1G7SQynyxlpTHiQqWrJHucigFFKhFwPSkgRaI'
);

Parse.serverURL =
'https://parseapi.back4app.com/';



// ===============================
// ADMIN CHECK
// ===============================

async function checkAdmin(){

    const currentUser =
    await Parse.User.currentAsync();

    if(
        !currentUser ||
        !currentUser.get("isAdmin")
    ){
        alert("Unauthorized");
        location.href = "/";
    }

}

checkAdmin();

// ===============================
// ELEMENTS
// ===============================

const usersContainer =
document.getElementById(
    "usersContainer"
);

const searchInput =
document.getElementById(
    "searchInput"
);

let allUsers = [];


// ===============================
// LOAD USERS
// ===============================

async function loadUsers(){

    try{

        const users =
        await Parse.Cloud.run(
            "getAllUsers"
        );

        allUsers = users;

        renderUsers(users);

    }catch(error){

        console.log(error);

        alert(error.message);

    }

}


// ===============================
// RENDER USERS
// ===============================

function renderUsers(users){

    usersContainer.innerHTML = "";

    users.forEach(user => {

        usersContainer.innerHTML += `

        <div class="user-card">

            <div class="user-top">

                <div>

                    <div class="user-name">
                        ${user.firstName || "Unknown User"}
                    </div>

                    <div class="user-email">
                        ${user.email}
                    </div>

                    <div class="last-seen">
                        ID: ${user.id}
                    </div>

                </div>

                <div class="active-badge">

                    ${
                        user.isBlocked
                        ? "Blocked"
                        : "Active"
                    }

                </div>

            </div>


            <div class="balance-box">

                <div>

                    <div class="balance-title">
                        Balance
                    </div>

                    <div class="balance">
                        ₦${Number(
                            user.walletBalance
                        ).toLocaleString()}
                    </div>

                </div>

                <button
                    class="edit-btn"
                    onclick="editBalance(
                        '${user.id}',
                        '${user.walletBalance}'
                    )"
                >
                    Edit
                </button>

            </div>


            <div class="settings">

                ${toggleItem(
                    user,
                    "Auto-Approve Coupons",
                    "Automatically approve coupon receipts",
                    "autoApproveCoupons"
                )}

                ${toggleItem(
                    user,
                    "Auto-Approve Upgrades",
                    "Automatically approve upgrades",
                    "autoApproveUpgrades"
                )}

                ${toggleItem(
                    user,
                    "Must Upgrade",
                    "Lock features until user upgrades",
                    "mustUpgrade"
                )}

                ${toggleItem(
                    user,
                    "Disable Withdrawal Notif",
                    "Skip withdrawal notification",
                    "disableWithdrawalNotif"
                )}

            </div>


            <div class="action-buttons">

                <button
                    class="action-btn lock-btn"
                    onclick="toggleBlock(
                        '${user.id}',
                        ${user.isBlocked}
                    )"
                >

                    ${
                        user.isBlocked
                        ? "Unlock Account"
                        : "Lock Account"
                    }

                </button>

                <div class="bottom-actions">

                    <button
                        class="action-btn ban-btn"
                    >
                        Ban Phone
                    </button>

                    <button
                        class="action-btn delete-btn"
                        onclick="deleteUser(
                            '${user.id}'
                        )"
                    >
                        Delete Account
                    </button>

                </div>

            </div>

        </div>

        `;

    });

}


// ===============================
// TOGGLE HTML
// ===============================

function toggleItem(
    user,
    title,
    desc,
    field
){

    const isActive =
    Boolean(user[field]);

    return `

    <div class="setting-item">

        <div>

            <div class="setting-title">
                ${title}
            </div>

            <div class="setting-desc">
                ${desc}
            </div>

        </div>

        <div
            class="toggle ${isActive ? "active" : ""}"

            data-user="${user.id}"
            data-field="${field}"
            data-value="${isActive}"

            onclick="handleToggle(this)"
        >

            <div class="toggle-circle"></div>

        </div>

    </div>

    `;

}

async function handleToggle(element){

    const userId =
    element.dataset.user;

    const field =
    element.dataset.field;

    const currentValue =
    element.dataset.value === "true";

    const newValue =
    !currentValue;

    try{

        await Parse.Cloud.run(
            "toggleUserSetting",
            {
                userId,
                field,
                value:newValue
            }
        );

        element.dataset.value =
        newValue;

        element.classList.toggle(
            "active"
        );

    }catch(error){

        console.error(error);

        alert(error.message);

    }

}


// ===============================
// UPDATE BALANCE
// ===============================

async function editBalance(
    userId,
    currentBalance
){

    const amount =
    prompt(
        "Enter new balance",
        currentBalance
    );

    if(amount === null) return;

    try{

        await Parse.Cloud.run(
            "updateUserBalance",
            {
                userId,
                amount
            }
        );

        loadUsers();

    }catch(error){

        alert(error.message);

    }

}


// ===============================
// TOGGLE SETTINGS
// ===============================



// ===============================
// LOCK ACCOUNT
// ===============================

async function toggleBlock(
    userId,
    currentState
){

    try{

        await Parse.Cloud.run(
            "toggleUserSetting",
            {
                userId,
                field:"isBlocked",
                value:!currentState
            }
        );

        loadUsers();

    }catch(error){

        alert(error.message);

    }

}


// ===============================
// DELETE USER
// ===============================

async function deleteUser(
    userId
){

    const confirmDelete =
    confirm(
        "Delete this account?"
    );

    if(!confirmDelete) return;

    try{

        await Parse.Cloud.run(
            "deleteUser",
            {
                userId
            }
        );

        loadUsers();

    }catch(error){

        alert(error.message);

    }

}


// ===============================
// SEARCH
// ===============================

searchInput.addEventListener(
    "input",
    e => {

    const value =
    e.target.value.toLowerCase();

    const filtered =
    allUsers.filter(user => {

        return (

            (user.firstName || "")
            .toLowerCase()
            .includes(value)

            ||

            (user.email || "")
            .toLowerCase()
            .includes(value)

            ||

            (user.phone || "")
            .toLowerCase()
            .includes(value)

            ||

            user.id
            .toLowerCase()
            .includes(value)

        );

    });

    renderUsers(filtered);

});


// ===============================
// AUTO REFRESH
// ===============================

setInterval(() => {

    loadUsers();

}, 10000);


// ===============================
// INITIAL LOAD
// ===============================

loadUsers();
</script>

</body>
</html>
