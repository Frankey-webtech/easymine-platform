<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
/>

<title>Transaction Details</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#0d0d0d;
font-family:Arial,sans-serif;
color:#fff;
overflow-x:hidden;
}

/* =========================
FAKE PHONE STATUS BAR
========================= */

.status-bar{
height:34px;
padding:0 14px;
display:flex;
align-items:center;
justify-content:space-between;
background:#202020;
position:sticky;
top:0;
z-index:9999;
}

.status-left{
display:flex;
align-items:center;
gap:10px;
font-weight:600;
font-size:15px;
}

.status-icons-left{
display:flex;
align-items:center;
gap:9px;
font-size:14px;
}

.status-right{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}

.signal-bars{
display:flex;
align-items:flex-end;
gap:2px;
height:14px;
}

.signal-bars span{
display:block;
width:3px;
background:#fff;
border-radius:3px;
}

.signal-bars span:nth-child(1){
height:5px;
opacity:.45;
}

.signal-bars span:nth-child(2){
height:7px;
opacity:.6;
}

.signal-bars span:nth-child(3){
height:10px;
opacity:.8;
}

.signal-bars span:nth-child(4){
height:13px;
}

.battery{
width:25px;
height:13px;
border:1.8px solid #fff;
border-radius:3px;
position:relative;
display:flex;
align-items:center;
padding:1px;
}

.battery::after{
content:"";
position:absolute;
right:-4px;
width:2px;
height:6px;
background:#fff;
border-radius:1px;
}

.battery-fill{
height:100%;
width:23%;
background:#fff;
border-radius:1px;
}

.battery-percent{
position:absolute;
font-size:9px;
font-weight:bold;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:#fff;
}

/* =========================
APP HEADER
========================= */

.header{
height:74px;
background:#202020;
padding:0 18px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header-left{
display:flex;
align-items:center;
gap:14px;
}

.back-btn{
font-size:20px;
color:#d6d6d6;
cursor:pointer;
}

.page-title{
font-size:17px;
font-weight:500;
color:#d8d8d8;
}

.support-icon{
width:28px;
height:28px;
}

/* =========================
MAIN
========================= */

.main{
padding:18px 15px 40px;
max-width:430px;
margin:auto;
}

/* =========================
CARDS
========================= */

.card{
background:#222222;
border-radius:22px;
padding:22px 18px;
margin-bottom:18px;
position:relative;
overflow:hidden;
}

/* =========================
AMOUNT CARD
========================= */

.amount-card{
padding-top:60px;
padding-bottom:24px;
}

.bank-logo{
position:absolute;
top:-4px;
left:50%;
transform:translateX(-50%);
width:64px;
height:64px;
border-radius:50%;
background:#f2f2f2;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 6px 18px rgba(0,0,0,.5);
}

.bank-logo img{
width:58px;
height:58px;
border-radius:50%;
object-fit:cover;
}

.transfer-text{
text-align:center;
font-size:16px;
font-weight:600;
line-height:1.5;
color:#ededed;
margin-bottom:16px;
}

.amount{
text-align:center;
font-size:38px;
font-weight:700;
letter-spacing:-1px;
margin-bottom:16px;
}

.success-row{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
font-size:17px;
color:#18d58c;
}

.success-icon{
width:28px;
height:28px;
border-radius:50%;
background:#18d58c;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
color:#fff;
}

/* =========================
DETAILS
========================= */

.section-title{
font-size:20px;
font-weight:700;
margin-bottom:20px;
color:#f0f0f0;
}

.detail-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:18px;
margin-bottom:22px;
}

.detail-label{
font-size:15px;
color:#9f9f9f;
min-width:120px;
line-height:1.4;
}

.detail-value{
font-size:15px;
color:#f3f3f3;
text-align:right;
line-height:1.35;
word-break:break-word;
flex:1;
display:flex;
justify-content:flex-end;
align-items:flex-start;
gap:6px;
}

.arrow{
font-size:15px;
opacity:.9;
}

.copy-btn{
background:none;
border:none;
padding:0;
color:#cfcfcf;
font-size:16px;
cursor:pointer;
margin-top:2px;
}

.copy-btn:active{
transform:scale(.95);
}

/* =========================
MORE ACTIONS
========================= */

.dashed{
border-top:1px dashed #4c4c4c;
margin:18px 0;
}

.transfer-back{
display:flex;
align-items:center;
gap:10px;
font-size:16px;
color:#18d58c;
}

/* =========================
BUTTON
========================= */

.share-btn{
width:100%;
height:64px;
border:none;
border-radius:50px;
background:#20d6a0;
font-size:18px;
font-weight:700;
color:#102019;
cursor:pointer;
margin-top:6px;
}

.share-btn:active{
transform:scale(.99);
}

/* =========================
TOAST
========================= */

.toast{
position:fixed;
left:50%;
bottom:100px;
transform:translateX(-50%);
background:#2f2f2f;
padding:12px 18px;
border-radius:18px;
font-size:14px;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:99999;
}

.toast.show{
opacity:1;
}

/* =========================
SMALL DEVICES
========================= */

@media(max-width:360px){

.amount{
font-size:32px;
}

.detail-label,
.detail-value{
font-size:14px;
}

}

</style>
</head>

<body>

<!-- =========================
PHONE STATUS BAR
========================= -->

<div class="status-bar" id="statusBar">

<div class="status-left">

<div id="statusTime"></div>

<div class="status-icons-left">

<i class="fa-brands fa-whatsapp"></i>

<i class="fa-solid fa-gamepad"></i>

<i class="fa-solid fa-wave-square"></i>

</div>

</div>

<div class="status-right">

<div id="networkType">
3G
</div>

<div id="networkSpeed">
2.1 k/s
</div>

<div class="signal-bars" id="signalBars">
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<div class="battery" id="battery">
<div class="battery-fill"></div>
<div class="battery-percent" id="batteryPercent">
23
</div>
</div>

</div>

</div>

<!-- =========================
APP HEADER
========================= -->

<div class="header" id="header">

<div class="header-left">

<div class="back-btn" id="backBtn">
<i class="fa-solid fa-chevron-left"></i>
</div>

<div class="page-title" id="pageTitle">
Transaction Details
</div>

</div>

<svg
class="support-icon"
id="supportIcon"
viewBox="0 0 24 24"
fill="none"
stroke="#00c57b"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M4 12a8 8 0 0 1 16 0"></path>
<rect x="2" y="12" width="4" height="6" rx="2"></rect>
<rect x="18" y="12" width="4" height="6" rx="2"></rect>
<path d="M12 20v2"></path>
<path d="M9 22h6"></path>

</svg>

</div>

<!-- =========================
MAIN
========================= -->

<div class="main" id="receipt">

<!-- =========================
AMOUNT CARD
========================= -->

<div class="card amount-card" id="amountCard">

<div class="bank-logo" id="bankLogo">
<img
id="bankLogoImg"
src="palmpaylogo.png"
/>
</div>

<div class="transfer-text" id="transferText"></div>

<div class="amount" id="amount"></div>

<div class="success-row" id="successRow">

<div class="success-icon">
<i class="fa-solid fa-check"></i>
</div>

<div id="successText"></div>

</div>

</div>

<!-- =========================
DETAILS CARD
========================= -->

<div class="card" id="detailsCard">

<div class="section-title" id="detailsTitle">
Transaction Details
</div>

<!-- ROW -->

<div class="detail-row" id="creditedRow">

<div class="detail-label">
Credited to
</div>

<div class="detail-value">

<span id="creditedTo">
Available Balance
</span>

<span class="arrow">
<i class="fa-solid fa-chevron-right"></i>
</span>

</div>

</div>

<!-- ROW -->

<div class="detail-row" id="senderRow">

<div class="detail-label">
Sender Details
</div>

<div class="detail-value" id="senderDetails"></div>

</div>

<!-- ROW -->

<div class="detail-row" id="remarkRow">

<div class="detail-label">
Remark
</div>

<div class="detail-value" id="remark"></div>

</div>

<!-- ROW -->

<div class="detail-row" id="typeRow">

<div class="detail-label">
Transaction Type
</div>

<div class="detail-value" id="transactionType"></div>

</div>

<!-- ROW -->

<div class="detail-row" id="txRow">

<div class="detail-label">
Transaction No.
</div>

<div class="detail-value">

<span id="transactionNo"></span>

<button
class="copy-btn"
id="copyTxBtn"
onclick="copyText('transactionNo')">

<i class="fa-regular fa-copy"></i>

</button>

</div>

</div>

<!-- ROW -->

<div class="detail-row" id="dateRow">

<div class="detail-label">
Transaction Date
</div>

<div class="detail-value" id="transactionDate"></div>

</div>

<!-- ROW -->

<div class="detail-row" id="sessionRow">

<div class="detail-label">
Session ID
</div>

<div class="detail-value">

<span id="sessionId"></span>

<button
class="copy-btn"
id="copySessionBtn"
onclick="copyText('sessionId')">

<i class="fa-regular fa-copy"></i>

</button>

</div>

</div>

</div>

<!-- =========================
MORE ACTIONS
========================= -->

<div class="card" id="actionsCard">

<div class="section-title">
More Actions
</div>

<div class="detail-row">

<div class="detail-label">
Category
</div>

<div class="detail-value">

<span id="categoryText">
Deposit
</span>

<span class="arrow">
<i class="fa-solid fa-chevron-right"></i>
</span>

</div>

</div>

<div class="dashed"></div>

<div class="transfer-back" id="transferBackBtn">

<i class="fa-solid fa-rotate-left"></i>

<div>
Transfer Back
</div>

</div>

</div>

<!-- =========================
BUTTON
========================= -->

<button
class="share-btn"
id="shareReceiptBtn"
onclick="downloadReceipt()">

Share Receipt

</button>

</div>

<!-- =========================
TOAST
========================= -->

<div class="toast" id="toast">
Copied Successfully
</div>


<script>

Parse.initialize(
'MTLDbgDiz5KBGgnGUxe8bT0VLY0AsLtaneLWXgBl',
'YZQ1G7SQynyxlpTHiQqWrJHucigFFKhFwPSkgRaI'
);

Parse.serverURL =
'https://parseapi.back4app.com/';

const params =
new URLSearchParams(
window.location.search
);

const transactionId =
params.get("id");

async function loadReceipt(){

try{

const query =
new Parse.Query(
"Transactions"
);

query.equalTo(
"objectId",
transactionId
);

query.include("user");

const tx =
await query.first();

if(!tx){

alert(
"Transaction not found"
);

return;

}

document.getElementById(
"amount"
).innerText =
`₦${Number(
tx.get("amount")
).toLocaleString()}`;

document.getElementById(
"transferText"
).innerText =
`Transfer to ${tx.get("senderName")}`;

document.getElementById(
"successText"
).innerText =
tx.get("status");

document.getElementById(
"creditedTo"
).innerText =
tx.get("balanceType");

document.getElementById(
"senderDetails"
).innerHTML =
`
${tx.get("senderName")}<br>
${tx.get("senderBank")} |
${tx.get("senderAccount")}
`;

document.getElementById(
"remark"
).innerText =
tx.get("remark");

document.getElementById(
"transactionType"
).innerText =
tx.get("transactionType");

document.getElementById(
"transactionNo"
).innerText =
tx.get("transactionNo");

document.getElementById(
"transactionDate"
).innerText =
tx.get(
"createdAtFormatted"
);

document.getElementById(
"sessionId"
).innerText =
tx.get("sessionId");

}catch(err){

console.error(err);

alert(
"Failed to load receipt"
);

}

}

loadReceipt();

</script>
<script>

function copyText(id){

const text =
document.getElementById(id)
.innerText;

navigator.clipboard.writeText(
text
);

const toast =
document.getElementById(
"toast"
);

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove(
"show"
);

},2000);

}

</script>
<script>

async function downloadReceipt(){

const receipt =
document.getElementById(
"receipt"
);

const canvas =
await html2canvas(
receipt,
{
scale:3
}
);

canvas.toBlob(async(blob)=>{

const file =
new File(
[blob],
"receipt.png",
{
type:"image/png"
}
);

if(
navigator.share &&
navigator.canShare({
files:[file]
})
){

await navigator.share({
files:[file],
title:"Receipt"
});

}else{

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"receipt.png";

link.click();

}

});

}

</script>
<script>

function updateNetworkStatus(){

const networkType =
document.getElementById(
"networkType"
);

const networkSpeed =
document.getElementById(
"networkSpeed"
);

const signalBars =
document.getElementById(
"signalBars"
);


// OFFLINE

if(!navigator.onLine){

networkType.innerText =
"Offline";

networkSpeed.innerText =
"0 k/s";

signalBars.style.opacity =
"0.3";

return;

}

signalBars.style.opacity =
"1";


// CONNECTION API

const connection =
navigator.connection ||
navigator.mozConnection ||
navigator.webkitConnection;


if(connection){

// NETWORK TYPE

const type =
connection.effectiveType;

if(type === "4g"){

networkType.innerText =
"4G";

}else if(type === "3g"){

networkType.innerText =
"3G";

}else if(type === "2g"){

networkType.innerText =
"2G";

}else{

networkType.innerText =
"5G";

}


// SPEED

const speed =
connection.downlink || 0;

networkSpeed.innerText =
speed + " mb/s";


// SIGNAL BARS

const bars =
signalBars.querySelectorAll(
"span"
);

bars.forEach(bar=>{

bar.style.opacity = "0.3";

});

if(speed >= 10){

bars[0].style.opacity = "1";
bars[1].style.opacity = "1";
bars[2].style.opacity = "1";
bars[3].style.opacity = "1";

}else if(speed >= 5){

bars[0].style.opacity = "1";
bars[1].style.opacity = "1";
bars[2].style.opacity = "1";

}else if(speed >= 1){

bars[0].style.opacity = "1";
bars[1].style.opacity = "1";

}else{

bars[0].style.opacity = "1";

}

}else{

networkType.innerText =
"Online";

networkSpeed.innerText =
"--";

}

}

updateNetworkStatus();

window.addEventListener(
"online",
updateNetworkStatus
);

window.addEventListener(
"offline",
updateNetworkStatus
);

if(navigator.connection){

navigator.connection.addEventListener(
"change",
updateNetworkStatus
);

}

</script>
<script>

async function loadBattery(){

if(!navigator.getBattery){

document.getElementById(
"batteryPercent"
).innerText = "--";

return;

}

try{

const battery =
await navigator.getBattery();

function updateBattery(){

const level =
Math.round(
battery.level * 100
);

const batteryFill =
document.querySelector(
".battery-fill"
);

document.getElementById(
"batteryPercent"
).innerText = level;

batteryFill.style.width =
level + "%";


// BATTERY COLORS

if(level <= 20){

batteryFill.style.background =
"#ff3b30";

}else if(level <= 50){

batteryFill.style.background =
"#ffcc00";

}else{

batteryFill.style.background =
"#00c853";

}


// CHARGING STATUS

if(battery.charging){

batteryFill.style.boxShadow =
"0 0 10px #00ff99";

}else{

batteryFill.style.boxShadow =
"none";

}

}

updateBattery();

battery.addEventListener(
"levelchange",
updateBattery
);

battery.addEventListener(
"chargingchange",
updateBattery
);

}catch(err){

console.log(
"Battery API error",
err
);

}

}

loadBattery();

</script>
<script>

function updateTime(){

const now = new Date();

const time =
now.toLocaleTimeString(
[],
{
hour: "2-digit",
minute: "2-digit",
hour12: false
}
);

document.getElementById(
"statusTime"
).innerText = time;

}

updateTime();

setInterval(
updateTime,
1000
);
</script>
</body>
</html>
