<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Easy Mine Welcome</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
/>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
/>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>
  *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Inter',sans-serif;

  background:
  linear-gradient(
    135deg,
    #000000,
    #050505,
    #0b0b0b,
    #000000
  );

  min-height:100vh;

  overflow-x:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;

  position:relative;

  padding:24px;
}

/* =========================
PREMIUM BACKGROUND
========================= */

.bg-glow{

  position:absolute;

  width:500px;
  height:500px;

  border-radius:50%;

  background:
  radial-gradient(
    circle,
    rgba(255,215,0,.22),
    transparent 70%
  );

  filter:blur(120px);

  opacity:.7;

  top:-180px;
  left:-120px;

  animation:glowMove 10s ease infinite;
}

.bg-glow2{

  position:absolute;

  width:420px;
  height:420px;

  border-radius:50%;

  background:
  radial-gradient(
    circle,
    rgba(255,180,0,.18),
    transparent 70%
  );

  filter:blur(120px);

  opacity:.6;

  bottom:-180px;
  right:-120px;

  animation:glowMove2 12s ease infinite;
}

@keyframes glowMove{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(20px);
  }

  100%{
    transform:translateY(0);
  }
}

@keyframes glowMove2{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-20px);
  }

  100%{
    transform:translateY(0);
  }
}

/* =========================
FLOATING PARTICLES
========================= */

.particles{

  position:absolute;
  inset:0;

  overflow:hidden;

  z-index:0;
}

.particles span{

  position:absolute;

  display:block;

  border-radius:50%;

  background:
  radial-gradient(
    circle at 30% 30%,
    rgba(255,255,255,.95),
    rgba(255,215,0,.15)
  );

  border:
  1px solid rgba(255,215,0,.12);

  box-shadow:
  0 0 18px rgba(255,215,0,.14);

  animation:
  floatParticle linear infinite;

  opacity:.4;
}

@keyframes floatParticle{

  0%{
    transform:
    translateY(0)
    scale(1);

    opacity:0;
  }

  10%{
    opacity:.5;
  }

  100%{
    transform:
    translateY(-120vh)
    scale(1.4);

    opacity:0;
  }
}

/* =========================
MAIN CARD
========================= */

.welcome-card{

  position:relative;

  z-index:10;

  width:100%;
  max-width:440px;

  background:
  rgba(10,10,10,.92);

  backdrop-filter:blur(24px);

  border:
  1px solid rgba(255,215,0,.10);

  border-radius:34px;

  padding:42px 26px 32px;

  text-align:center;

  overflow:hidden;

  box-shadow:
  0 25px 80px rgba(0,0,0,.65),
  0 0 45px rgba(255,215,0,.06),
  inset 0 0 20px rgba(255,255,255,.02);
}

.welcome-card::before{

  content:"";

  position:absolute;

  inset:0;

  background:
  linear-gradient(
    135deg,
    rgba(255,215,0,.05),
    transparent,
    rgba(255,215,0,.03)
  );

  pointer-events:none;
}

/* =========================
LOGO IMAGE
========================= */

.logo{

  width:110px;
  height:110px;

  margin:0 auto 28px;

  object-fit:contain;

  display:block;

  filter:
  drop-shadow(
    0 0 18px rgba(255,215,0,.25)
  );

}

.logo::before{

  content:"";

  position:absolute;

  inset:2px;

  border-radius:30px;

  border:
  1px solid rgba(255,255,255,.25);
}

.logo svg{

  width:52px;
  height:52px;

  stroke:#111;

  filter:
  drop-shadow(
    0 0 5px rgba(255,255,255,.25)
  );
}

/* =========================
TEXT
========================= */

.title{

  font-size:2.2rem;

  font-weight:800;

  line-height:1.25;

  margin-bottom:14px;

  letter-spacing:-1px;
}

.title span{

  background:
  linear-gradient(
    90deg,
    #FFD700,
    #FFB800
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{

  font-size:15px;

  line-height:1.9;

  color:rgba(255,255,255,.62);

  max-width:320px;

  margin:0 auto 38px;
}

/* =========================
FEATURES
========================= */

.features{

  display:flex;
  flex-direction:column;

  gap:18px;

  margin-bottom:38px;
}

.feature-box{

  background:
  rgba(255,255,255,.025);

  border:
  1px solid rgba(255,215,0,.08);

  border-radius:24px;

  padding:18px;

  display:flex;
  align-items:center;

  gap:16px;

  text-align:left;

  transition:.3s ease;

  backdrop-filter:blur(10px);
}

.feature-box:hover{

  transform:
  translateY(-3px);

  border-color:
  rgba(255,215,0,.22);

  background:
  rgba(255,215,0,.03);

  box-shadow:
  0 10px 30px rgba(255,215,0,.06);
}

.feature-icon{

  width:58px;
  height:58px;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #FFD700,
    #FFB800
  );

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  box-shadow:
  0 8px 22px rgba(255,215,0,.20);
}

.feature-icon svg{

  width:26px;
  height:26px;

  stroke:#111;
}

.feature-text{

  font-size:16px;

  font-weight:600;

  line-height:1.5;

  color:white;
}

/* =========================
BUTTON
========================= */

.get-started{

  width:100%;
  height:64px;

  border:none;
  outline:none;

  border-radius:22px;

  background:
  linear-gradient(
    90deg,
    #FFD700,
    #FFB800
  );

  color:#111;

  font-size:20px;
  font-weight:800;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:12px;

  transition:.3s ease;

  box-shadow:
  0 12px 35px rgba(255,215,0,.24);
}

.get-started:hover{

  transform:
  translateY(-2px);

  box-shadow:
  0 15px 45px rgba(255,215,0,.30);
}

.get-started:active{

  transform:
  scale(.98);
}

/* =========================
SKIP
========================= */

.skip{

  margin-top:24px;

  font-size:15px;

  font-weight:500;

  color:rgba(255,255,255,.52);

  cursor:pointer;

  transition:.3s ease;
}

.skip:hover{

  color:#FFD700;
}

/* =========================
MOBILE
========================= */

@media(max-width:480px){

  body{
    padding:16px;
  }

  .welcome-card{
    padding:36px 20px 28px;
    border-radius:28px;
  }

  .logo{
    width:100px;
    height:100px;
  }

  .title{
    font-size:1.9rem;
  }

  .subtitle{
    font-size:14px;
  }

  .feature-box{
    padding:16px;
  }

  .feature-icon{
    width:52px;
    height:52px;
  }

  .get-started{
    height:58px;
    font-size:18px;
  }
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<div class="particles"></div>

<div class="welcome-card">

  <!-- LOGO -->
<img
src="logo.png"
class="logo"
alt="Easy Mine Logo">

  <!-- TEXT -->
  <h1 class="title">
    Welcome to <br> <span>Easy Mine</span>
  </h1>

  <p class="subtitle">
    You'll be able to: <br>
  
  </p>

  <!-- FEATURES -->
  <div class="features">

    <div class="feature-box">

      <div class="feature-icon">⛏

      </div>

      <div class="feature-text">
        Mine daily
      </div>

    </div>

    <div class="feature-box">

      <div class="feature-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
  xmlns="http://www.w3.org/2000/svg"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round">

  <!-- checklist box -->
  <rect x="3" y="4" width="18" height="16" rx="3" />

  <!-- check marks -->
  <path d="M7 9l1.5 1.5L11 8" />
  <path d="M7 13l1.5 1.5L11 12" />

  <!-- lines -->
  <path d="M13 9h4" />
  <path d="M13 13h4" />

</svg></div>

      <div class="feature-text">
        Complete tasks to earn
      </div>

    </div>

<div class="feature-box">

  <div class="feature-icon">

    <svg
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >

      <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

      <circle cx="10" cy="7" r="4"/>

      <path d="M20 8v6"/>

      <path d="M23 11h-6"/>

    </svg>

  </div>

  <div class="feature-text">
    Refer friends and earn rewards
  </div>

</div>
    <div class="feature-box">

      <div class="feature-icon">

        <svg
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <path d="M12 5v14"/>
          <path d="M19 12l-7 7-7-7"/>
        </svg>

      </div>

      <div class="feature-text">
        Withdraw to your bank
      </div>

    </div>

  </div>

  <!-- BUTTON -->
  <button
    class="get-started"
    id="getStartedBtn"
  >
    Get Started
    
  </button>



</div>


<script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>

<script>

/* =========================
PARTICLES
========================= */

const particles =
document.querySelector(".particles");

for(let i = 0; i < 35; i++){

  const dot =
  document.createElement("span");

  const size =
  Math.random() * 8 + 3;

  dot.style.width =
  size + "px";

  dot.style.height =
  size + "px";

  dot.style.left =
  Math.random() * 100 + "%";

  dot.style.bottom =
  "-20px";

  dot.style.animationDuration =
  (Math.random() * 10 + 8)
  + "s";

  dot.style.animationDelay =
  (Math.random() * 5)
  + "s";

  particles.appendChild(dot);

}

Parse.CoreManager.set(
  "FORCE_REVOCABLE_SESSION",
  true
);

Parse.initialize(
'MTLDbgDiz5KBGgnGUxe8bT0VLY0AsLtaneLWXgBl',
'YZQ1G7SQynyxlpTHiQqWrJHucigFFKhFwPSkgRaI'
);

Parse.serverURL =
'https://parseapi.back4app.com/';

/* =========================
CHECK LOGIN SESSION
========================= */
function checkUser() {
  const user = Parse.User.current();

  if (!user) {
    console.log("No user session found");
    window.location.href = "index.html";
    return;
  }

  console.log("User is logged in:", user.get("email"));
}

checkUser();

/* =========================
GET STARTED BUTTON
========================= */
document.getElementById("getStartedBtn").onclick = async () => {
  const user = Parse.User.current();

  if (!user) {
    alert("Please log in first");
    return;
  }

  try {
    user.set("completedIntro", true);
    await user.save();

    window.location.href = "home.html";

  } catch (err) {
    console.log(err);
    alert("Failed to continue");
  }
};
</script>
</body>
</html>
