<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#0d0d0d;
font-family:Arial,sans-serif;
color:#fff;
overflow-x:hidden;
}

/* =========================
FAKE PHONE STATUS BAR
========================= */

.status-bar{
height:34px;
padding:0 14px;
display:flex;
align-items:center;
justify-content:space-between;
background:#202020;
position:sticky;
top:0;
z-index:9999;
}

.status-left{
display:flex;
align-items:center;
gap:10px;
font-weight:600;
font-size:15px;
}

.status-icons-left{
display:flex;
align-items:center;
gap:9px;
font-size:14px;
}

.status-right{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}

.signal-bars{
display:flex;
align-items:flex-end;
gap:2px;
height:14px;
}

.signal-bars span{
display:block;
width:3px;
background:#fff;
border-radius:3px;
}

.signal-bars span:nth-child(1){
height:5px;
opacity:.45;
}

.signal-bars span:nth-child(2){
height:7px;
opacity:.6;
}

.signal-bars span:nth-child(3){
height:10px;
opacity:.8;
}

.signal-bars span:nth-child(4){
height:13px;
}

.battery{
width:25px;
height:13px;
border:1.8px solid #fff;
border-radius:3px;
position:relative;
display:flex;
align-items:center;
padding:1px;
}

.battery::after{
content:"";
position:absolute;
right:-4px;
width:2px;
height:6px;
background:#fff;
border-radius:1px;
}

.battery-fill{
height:100%;
width:23%;
background:#fff;
border-radius:1px;
}

.battery-percent{
position:absolute;
font-size:9px;
font-weight:bold;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:#fff;
}

/* =========================
APP HEADER
========================= */

.header{
height:74px;
background:#202020;
padding:0 18px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header-left{
display:flex;
align-items:center;
gap:14px;
}

.back-btn{

color:#d6d6d6;

.page-title{

font-weight:500;
color:#d8d8d8;
}

.support-icon{
width:28px;
height:28px;

/* =========================
MAIN
========================= */

/* =========================
CARDS
========================= */

.card{

/* =========================
AMOUNT CARD
========================= */

.amount-card{

}

.bank-logo{
position:absolute;
top:-4px;
left:50%;
transform:translateX(-50%);
width:64px;
height:64px;
border-radius:50%;
background:#f2f2f2;
display:flex;
align-items:center;
justify-content:center;

}

.bank-logo img{
width:58px;
height:58px;
border-radius:50%;
object-fit:cover;
}

.transfer-text{
text-align:center;
font-size:16px;
font-weight:600;
line-height:1.5;
color:#ededed;
margin-bottom:16px;
}

.amount{

font-weight:700;

margin-bottom:16px;
}

.success-row{

align-items:center;
justify-content:center;
gap:8px;
font-size:17px;
color:#18d58c;
}

.success-icon{
width:28px;
height:28px;
border-radius:50%;
background:#18d58c;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;

/* =========================
DETAILS
========================= */

font-weight:700;
margin-bottom:20px;
color:#f0f0f0;
}

.detail-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:18px;
margin-bottom:22px;

.detail-label{
font-size:15px;
color:#9f9f9f;

}

.detail-value{

align-items:flex-start;

.arrow{

margin-top:2px;

.copy-btn:active{

/* =========================
MORE ACTIONS
========================= */

.transfer-back{

align-items:center;
gap:10px;
font-size:16px;
color:#18d58c;

/* =========================
BUTTON
========================= */

height:64px;
border:none;
border-radius:50px;
background:#20d6a0;
font-size:18px;
font-weight:700;
color:#102019;
cursor:pointer;
margin-top:6px;
}

.share-btn:active{
transform:scale(.99);
}

/* =========================
TOAST
========================= */

.toast{
position:fixed;
left:50%;
bottom:100px;
transform:translateX(-50%);
background:#2f2f2f;
padding:12px 18px;
border-radius:18px;
font-size:14px;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:99999;
}

.toast.show{
opacity:1;
}

/* =========================
SMALL DEVICES
========================= */

@media(max-width:360px){

.amount{
font-size:32px;
}

.detail-label,
.detail-value{
font-size:14px;
}

}

display:flex;
align-items:center;
gap:10px;
}

.back-btn{
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
color:#d8d8d8;
cursor:pointer;
}

.page-title{
font-size:17px;
font-weight:500;
color:#d8d8d8;
}

.network-wrapper{
display:flex;
align-items:center;
gap:3px;
}

.data-arrows{
display:flex;
flex-direction:column;
line-height:8px;
margin-top:1px;
}

.up-arrow,
.down-arrow{
font-size:8px;
font-weight:bold;
color:#fff;
opacity:.9;
}

.up-arrow{
animation:uploadBlink 1s infinite;
}

.down-arrow{
animation:downloadBlink 1s infinite .5s;
}

@keyframes uploadBlink{

0%{
opacity:.2;
transform:translateY(2px);
}

50%{
opacity:1;
transform:translateY(0);
}

100%{
opacity:.2;
transform:translateY(2px);
}

}

@keyframes downloadBlink{

0%{
opacity:.2;
transform:translateY(-2px);
}

50%{
opacity:1;
transform:translateY(0);
}

100%{
opacity:.2;
transform:translateY(-2px);
}

#remark {

<script>

Parse.initialize(
'MTLDbgDiz5KBGgnGUxe8bT0VLY0AsLtaneLWXgBl',
'YZQ1G7SQynyxlpTHiQqWrJHucigFFKhFwPSkgRaI'
);

Parse.serverURL =
'https://parseapi.back4app.com/';


const params =
new URLSearchParams(
window.location.search
);

let transactionId =
params.get("id");

if(!transactionId){

    transactionId =
    localStorage.getItem(
        "latestWalletTransactionId"
    );

}

async function loadReceipt(){

try{

const query =
new Parse.Query(
"EasyMineWalletTransactions"
);

query.equalTo(
"objectId",
transactionId
);

query.include("user");

const tx =
await query.first();

if(!tx){

alert(
"Transaction not found"
);

return;

}

const type =
tx.get("type");

const isDebit =
type === "debit";

const amount =
Number(
tx.get("amount")
).toLocaleString();

document.getElementById("amount").innerText =
`₦${amount}`;

document.getElementById("amount").style.color =
"#f5f5f5";


document.getElementById(
"transferText"
).innerText =
isDebit
? `Transfer to ${tx.get("senderName")}`
: `Credit from Easy Mine Wallet`;

document.getElementById("amount").innerText =
`₦${Number(tx.get("amount")).toLocaleString()}`;

document.getElementById(
"successText"
).innerText =
tx.get("status");

document.getElementById(
"creditedTo"
).innerText =
tx.get("balanceType");

function mask10Digits(){
  const nums = "0123456789";
  let out = "";
  for(let i=0;i<10;i++){
    out += nums[Math.floor(Math.random()*10)];
  }
  return out.slice(0,3) + "****" + out.slice(6);
}

const senderName = (tx.get("senderName") || "").toUpperCase();
const senderBank = "EASY MINE PLATFORM";
const senderAccount = mask10Digits();
const digits = formatRemarkDigits(16);
const remark = tx.get("remark");
const remark2 = tx.get("remarkLine2") || "TRF FOR";
const cleanRemark = remark.replace(/\s+/g, "");
const finalRemark =
  digits + cleanRemark;

document.getElementById("senderDetails").innerHTML =
`
${senderName}<br>
${senderBank} | ${senderAccount}
`;


document.getElementById("remark").innerHTML = `
<div style="text-align:right; word-break:break-word; overflow-wrap:anywhere;">
  
  <div style="white-space:normal;">
    ${finalRemark}
  </div>

  <div style="margin-top:4px; text-align:right;">
    ${remark2}
  </div>

</div>
`;

document.getElementById(
"transactionType"
).innerText =
tx.get("transactionType");

document.getElementById(
"transactionNo"
).innerText =
tx.get("transactionNo");

document.getElementById(
"transactionDate"
).innerText =
tx.get(
"createdAtFormatted"
);

document.getElementById(
"sessionId"
).innerText =
tx.get("sessionId");

// CATEGORY

document.getElementById(
"categoryText"
).innerText =
isDebit
? "Transfer"
: "Deposit";

// ICON

document.getElementById(
"bankLogoImg"
).src =
isDebit
? "moniepointlogo.png"
: "palmpaylogo.png";

}catch(err){

console.error(err);

alert(
"Failed to load receipt"
);

}

}
if(!transactionId){

alert("No transaction found");

}else{
function formatRemarkDigits(len = 16) {
  const chars = "0123456789";
  let out = "";

  for (let i = 0; i < len; i++) {
    out += chars[Math.floor(Math.random() * chars.length)];
  }

  return out;
}
loadReceipt();

}

</script>
<script>

function goBack(){
window.history.back();

function copyText(id){

const text =
document.getElementById(id)
.innerText;

navigator.clipboard.writeText(
text

const toast =
document.getElementById(
"toast"
);

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove(
"show"
);

},2000);

}

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
async function downloadReceipt(){

    const receipt =
    document.getElementById("receipt");

    const canvas =
    await html2canvas(receipt,{
        scale:3
    });

    canvas.toBlob(async(blob)=>{

        const file =
        new File(
            [blob],
            "receipt.png",
            {
                type:"image/png"
            }
        );

        if(
            navigator.share &&
            navigator.canShare({
                files:[file]
            })
        ){

            await navigator.share({
                files:[file],
                title:"Receipt"
            });

        }else{

            const link =
            document.createElement("a");

            link.href =
            URL.createObjectURL(blob);

            link.download =
            "receipt.png";

            link.click();

        }

    });

}
</script>

<script>

async function loadBattery(){

if(!navigator.getBattery){

document.getElementById(
"batteryPercent"
).innerText = "--";

return;

}

try{

const battery =
await navigator.getBattery();

function updateBattery(){

const level =
Math.round(
battery.level * 100
);

const batteryFill =
document.querySelector(
".battery-fill"
);

document.getElementById(
"batteryPercent"
).innerText = level;

batteryFill.style.width =
level + "%";


// BATTERY COLORS

if(level <= 20){

batteryFill.style.background =
"#ff3b30";

}else if(level <= 50){

batteryFill.style.background =
"#ffcc00";

}else{

batteryFill.style.background =
"#00c853";

}


// CHARGING STATUS

if(battery.charging){

batteryFill.style.boxShadow =
"0 0 10px #00ff99";

}else{

batteryFill.style.boxShadow =
"none";

}

}

updateBattery();

battery.addEventListener(
"levelchange",
updateBattery
);

battery.addEventListener(
"chargingchange",
updateBattery
);

}catch(err){

console.log(
"Battery API error",
err
);

}

}

loadBattery();

</script>
