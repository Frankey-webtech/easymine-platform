*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;

body{
background:#181a1b;
font-family:Arial,sans-serif;
color:white;
overflow-x:hidden;
}

/* =========================
STATUS BAR
========================= */

.status-bar{
height:34px;
padding:0 14px;
display:flex;
align-items:center;
justify-content:space-between;
background:#202020;
position:sticky;
top:0;
z-index:9999;
}

.status-left{
display:flex;
align-items:center;
gap:10px;
font-weight:600;
font-size:15px;
}

.status-icons-left{
display:flex;
align-items:center;
gap:9px;
font-size:14px;
}

.status-right{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}

.signal-bars{
display:flex;
align-items:flex-end;
gap:2px;
height:14px;
}

.signal-bars span{
display:block;
width:3px;
background:#fff;
border-radius:3px;
}

.signal-bars span:nth-child(1){
height:5px;
opacity:.45;
}

.signal-bars span:nth-child(2){
height:7px;
opacity:.6;
}

.signal-bars span:nth-child(3){
height:10px;
opacity:.8;
}

.signal-bars span:nth-child(4){
height:13px;
}

.battery{
width:25px;
height:13px;
border:1.8px solid #fff;
border-radius:3px;
position:relative;
display:flex;
align-items:center;
padding:1px;
}

.battery::after{
content:"";
position:absolute;
right:-4px;
width:2px;
height:6px;
background:#fff;
border-radius:1px;
}

.battery-fill{
height:100%;
width:23%;
background:#fff;
border-radius:1px;
}

.battery-percent{
position:absolute;
font-size:9px;
font-weight:bold;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:#fff;
}

/* HEADER */



.header{
    height:72px;
    background:#1f2021;
    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-left{
    display:flex;
    align-items:center;
    gap:16px;
}

.back-btn{
    width:24px;

    justify-content:center;

.download{

    font-size:17px;
    font-weight:500;
}

/* FILTERS */

.filters{

    gap:18px;
    padding:18px 16px 16px;
}

a.transaction{
    text-decoration:none;
    color:inherit;
}

.filter-btn{
    flex:1;

    height:58px;
    background:#111213;
    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    color:#d8d8d8;
    font-size:17px;
}

.dropdown-arrow{
    font-size:10px;
    color:#7f7f7f;
}

/* MONTH CARD */

.month-card{
    background:#242526;
    margin:12px 16px;
    border-radius:24px;
    padding:22px 22px 8px;
}

.month-row{
display:flex;
justify-content:space-between;
align-items:center;
}



.month-arrow{
font-size:9px;
color:white;
margin-left:3px;
}

.month-title{

}

.analysis{

.summary{

.summary-divider{

.transaction{

    justify-content:space-between;
    align-items:center;
    padding:24px 0;
    border-top:none;
}



.icon{
    width:40px;
    height:40px;
    border-radius:50%;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;
}

.icon i{
    font-size:22px;
}

.green-bg{
background:#edf9f5;
}

.purple-bg{
background:#efe3ff;

.gold-bg{
background:#fff6e9;
}

.left{

    align-items:center;
    gap:14px;
    flex:1;
    min-width:0;
}

.left > div:last-child{

    min-width:0;

.title{

.amount{

.credit{

.debit{

#createBtn{
position:fixed;
bottom:25px;
right:22px;
width:68px;
height:68px;
border-radius:50%;
border:none;
background:#20d6a0;
color:white;
font-size:34px;
box-shadow:0 8px 25px rgba(0,0,0,.45);
z-index:999;
}


#createBtn:active{
transform:scale(.95);
}

.network-wrapper{
display:flex;
align-items:center;
gap:3px;
}

.data-arrows{
display:flex;
flex-direction:column;
line-height:7px;
margin-top:1px;
}

.up-arrow,
.down-arrow{
font-size:8px;
font-weight:bold;
color:#fff;
opacity:.9;
}

.up-arrow{
animation:uploadBlink 1s infinite;
}

.down-arrow{
animation:downloadBlink 1s infinite .5s;
}

@keyframes uploadBlink{

0%{
opacity:.2;
transform:translateY(2px);
}

50%{
opacity:1;
transform:translateY(0);
}

100%{
opacity:.2;
transform:translateY(2px);
}

}

@keyframes downloadBlink{

0%{
opacity:.2;
transform:translateY(-2px);
}

50%{
opacity:1;
transform:translateY(0);
}

100%{
opacity:.2;
transform:translateY(-2px);
}

}

.green-bg{
    background:#edf9f5;
}
</style>

<script>

async function loadTransactions(){

try{

const currentUser =
Parse.User.current();

if(!currentUser){

console.log("No user found");
return;

}

await currentUser.fetch();

const juneContainer =
document.getElementById(
"juneContainer"
);

const mayContainer =
document.getElementById(
"mayContainer"
);

juneContainer.innerHTML = "";
mayContainer.innerHTML = "";

const query =
new Parse.Query(
"EasyMineWalletTransactions"
);

query.equalTo(
"user",
currentUser
);

query.descending(
"createdAt"
);

const results =
await query.find();

console.log("Transactions:", results);

// =========================
// EMPTY STATE
// =========================

if(results.length === 0){

juneContainer.innerHTML = `

<div style="
padding:40px 0;
text-align:center;
color:#888;
font-size:15px;
">

No June transactions yet

</div>

`;

}

// =========================
// MONEY IN / OUT
// =========================

let totalIn = 0;
let totalOut = 0;

// =========================
// RENDER TX
// =========================

results.forEach(tx=>{

const isDebit =
tx.get("type") === "debit";

const amount =
Number(
tx.get("amount") || 0
);

if(isDebit){

totalOut += amount;

}else{

totalIn += amount;

}

juneContainer.innerHTML += `

<a
href="
easywalletreceipt.html?id=${tx.id}
"
class="transaction">

<div class="left">

<div
class="icon"
style="
background:#ffffff;
">

<i
class="
fa-solid
${isDebit
? "fa-arrow-up"
: "fa-arrow-down"}
"
style="
font-size:22px;
color:#20d6a0;
">
</i>

</div>

<div>

<div class="title">

${tx.get("title")}

</div>

<div class="date">

${tx.get("dateText")}

</div>

</div>

</div>

<div>

<div class="
amount
${isDebit ? "debit" : "credit"}
">

${isDebit ? "-" : "+"}
₦${amount.toLocaleString()}

</div>

<div class="status">

${tx.get("status") || "Successful"}

</div>

</div>

</a>

`;

});

hardcoded.forEach(tx=>{

mayContainer.innerHTML += `

<div class="transaction">

<div class="left">

${getIcon(tx.icon)}

<div>

<div class="title">
${tx.title}
</div>

<div class="date">
${tx.date}
</div>

</div>

</div>

<div>

<div class="
amount
${tx.type === "debit" ? "debit" : "credit"}
">

${tx.amount}

</div>

<div class="status">
Successful
</div>

</div>

</div>

`;


});
document.getElementById(
"moneyIn"
).innerText =
totalIn.toLocaleString(
undefined,
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

document.getElementById(
"moneyOut"
).innerText =
totalOut.toLocaleString(
undefined,
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);
}catch(err){

console.log(
"LOAD TX ERROR:",
err
);

}

}


loadTransactions();

</script>
