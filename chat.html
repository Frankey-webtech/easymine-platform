<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">


  <!-- Common CSS -->
<style>
  *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  min-height:100vh;
  overflow:hidden;
  color:white;
  position:relative;
}

/* =========================
PREMIUM BACKGROUND
========================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-5;

  background:
  radial-gradient(
    circle at top left,
    rgba(255,215,0,.10),
    transparent 30%
  ),

  radial-gradient(
    circle at bottom right,
    rgba(255,180,0,.08),
    transparent 35%
  ),

  linear-gradient(
    135deg,
    #000000,
    #070707,
    #0d0d0d,
    #050505
  );

  background-size:200% 200%;

  animation:bgMove 12s ease infinite;
}

@keyframes bgMove{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }

}

/* =========================
GOLD PARTICLES
========================= */

body::after{

  content:"";

  position:fixed;
  inset:0;

  z-index:-4;

  background-image:

  radial-gradient(
    circle,
    rgba(255,255,255,.12) 2px,
    transparent 2px
  ),

  radial-gradient(
    circle,
    rgba(255,215,0,.18) 4px,
    transparent 4px
  );

  background-size:120px 120px;

  animation:floatParticles 24s linear infinite;

  opacity:.5;
}

@keyframes floatParticles{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-120px);
  }

}

/* =========================
CHAT CONTAINER
========================= */

.chat-container{

  width:100%;
  max-width:430px;

  height:100vh;

  margin:auto;

  display:flex;
  flex-direction:column;

  padding:18px 14px;
}

/* =========================
CHAT HEADER
========================= */

.chat-header{

  width:100%;

  padding:22px 20px;

  border-radius:26px;

  background:
  rgba(12,12,12,.88);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,215,0,.08);

  box-shadow:
  0 0 35px rgba(255,215,0,.06),
  inset 0 0 20px rgba(255,255,255,.02);

  font-size:24px;
  font-weight:800;

  text-align:center;

  background-image:
  linear-gradient(
    90deg,
    #FFD700,
    #FFB800
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  margin-bottom:18px;
}

/* =========================
CHAT BOX
========================= */

.chat-box{

  flex:1;

  overflow-y:auto;

  padding:18px;

  border-radius:28px;

  background:
  rgba(12,12,12,.88);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,215,0,.08);

  box-shadow:
  0 0 35px rgba(255,215,0,.05),
  inset 0 0 18px rgba(255,255,255,.02);

  display:flex;
  flex-direction:column;
  gap:14px;
}

/* =========================
SCROLLBAR
========================= */

.chat-box::-webkit-scrollbar{
  width:4px;
}

.chat-box::-webkit-scrollbar-thumb{
  background:
  rgba(255,215,0,.25);

  border-radius:20px;
}

/* =========================
EMPTY CHAT
========================= */

.empty-chat{

  margin:auto;

  color:rgba(255,255,255,.38);

  font-size:14px;
  font-weight:500;
}

/* =========================
MESSAGES
========================= */

.message{

  max-width:82%;

  padding:14px 16px;

  border-radius:20px;

  position:relative;

  animation:fadeIn .25s ease;
}

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* =========================
USER MESSAGE
========================= */

.user-message{

  align-self:flex-end;

  background:
  linear-gradient(
    135deg,
    #FFD700,
    #FFB800
  );

  color:#111;

  border-bottom-right-radius:6px;

  box-shadow:
  0 0 22px rgba(255,215,0,.18);
}

/* =========================
ADMIN MESSAGE
========================= */

.admin-message{

  align-self:flex-start;

  background:
  rgba(255,255,255,.04);

  border:
  1px solid rgba(255,215,0,.08);

  color:white;

  border-bottom-left-radius:6px;
}

/* =========================
MESSAGE TIME
========================= */

.message-time{

  margin-top:8px;

  font-size:11px;
  font-weight:600;

  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;

  opacity:.7;
}

.user-message .message-time{
  color:#222;
}

.admin-message .message-time{
  color:rgba(255,255,255,.5);
}

/* =========================
MESSAGE STATUS
========================= */

.message-status{
  font-size:11px;
}

/* =========================
CHAT INPUT
========================= */

.chat-input{

  width:100%;

  display:flex;
  align-items:center;
  gap:12px;

  margin-top:18px;

  padding:10px;

  border-radius:22px;

  background:
  rgba(12,12,12,.88);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,215,0,.08);

  box-shadow:
  0 0 30px rgba(255,215,0,.05);
}

/* =========================
INPUT
========================= */

.chat-input input{

  flex:1;

  height:54px;

  border:none;
  outline:none;

  border-radius:16px;

  padding:0 16px;

  background:
  rgba(255,255,255,.03);

  border:
  1px solid rgba(255,215,0,.06);

  color:white;

  font-size:14px;

  transition:.3s ease;
}

.chat-input input:focus{

  border-color:#FFD700;

  box-shadow:
  0 0 0 4px rgba(255,215,0,.08);
}

.chat-input input::placeholder{
  color:rgba(255,255,255,.30);
}

/* =========================
SEND BUTTON
========================= */

.chat-input button{

  height:54px;

  padding:0 22px;

  border:none;
  outline:none;

  border-radius:16px;

  background:
  linear-gradient(
    90deg,
    #FFD700,
    #FFB800
  );

  color:#111;

  font-size:14px;
  font-weight:800;

  cursor:pointer;

  transition:.3s ease;

  box-shadow:
  0 0 24px rgba(255,215,0,.18);
}

.chat-input button:hover{

  transform:
  translateY(-2px);

  box-shadow:
  0 0 34px rgba(255,215,0,.28);
}

/* =========================
MOBILE
========================= */

@media(max-width:480px){

  .chat-container{
    padding:14px 10px;
  }

  .chat-header{
    font-size:22px;
    padding:20px 16px;
  }

  .chat-box{
    padding:14px;
    border-radius:24px;
  }

  .message{
    max-width:88%;
    font-size:14px;
  }

  .chat-input{
    padding:8px;
    gap:8px;
  }

  .chat-input input{
    height:50px;
  }

  .chat-input button{
    height:50px;
    padding:0 18px;
  }

}
close-modal{
  width:54px;
  height:54px;

  border:none;
  outline:none;

  border-radius:18px;

  background:
  rgba(255,255,255,.03);

  border:
  1px solid rgba(255,215,0,.08);

  color:#FFD700;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.3s ease;
}

.close-modal:hover{

  transform:
  rotate(90deg)
  scale(1.05);

  background:
  rgba(255,215,0,.08);

  box-shadow:
  0 0 20px rgba(255,215,0,.18);
}

</style>
</head>
<body>
 <button class="close-modal" onclick="window.location='home.html'">
     
        <i class="fa-solid fa-xmark"></i>
      </button>
  <div class="chat-container">

    <div class="chat-header">
      Live Chat Support
    </div>

    <div class="chat-box" id="chatBox">
      <div class="empty-chat" id="emptyChat">
        No messages yet...
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <!-- Parse SDK -->
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

  <script>

    // ========================================
    // PARSE CONFIGURATION
    // ========================================

    Parse.initialize(
'MTLDbgDiz5KBGgnGUxe8bT0VLY0AsLtaneLWXgBl',
'YZQ1G7SQynyxlpTHiQqWrJHucigFFKhFwPSkgRaI'
);

Parse.serverURL =
'https://parseapi.back4app.com/';



    // ========================================
    // USER DETAILS
    // ========================================

    const currentUser = Parse.User.current();

if (!currentUser) {
  alert("User not logged in");
}

const userId = currentUser.id;

const userName =
  currentUser.get("fullName") ||
  currentUser.get("username");

const userEmail =
  currentUser.get("email");


    // ========================================
    // DOM ELEMENTS
    // ========================================

    const chatBox = document.getElementById("chatBox");

    const messageInput = document.getElementById("messageInput");

    const emptyChat = document.getElementById("emptyChat");


    // ========================================
    // SEND MESSAGE
    // ========================================

    async function sendMessage() {

      const message = messageInput.value.trim();

      if (!message) {
        return;
      }

      try {

        await Parse.Cloud.run("sendMessage", {

          userId,
          userName,
          userEmail,
          message,
          sender: "user"

        });

        messageInput.value = "";

        loadMessages();

      } catch (error) {

        console.error(error);

        alert(error.message);

      }
    }


    // ========================================
    // LOAD MESSAGES
    // ========================================

    async function loadMessages() {

      try {

        const messages = await Parse.Cloud.run("getMessages", {
          userId
        });

        chatBox.innerHTML = "";

        if (messages.length === 0) {

          chatBox.innerHTML = `
            <div class="empty-chat">
              No messages yet...
            </div>
          `;

          return;
        }

        messages.forEach((msg) => {

          const messageDiv = document.createElement("div");

          messageDiv.classList.add("message");

          if (msg.sender === "user") {
            messageDiv.classList.add("user-message");
          } else {
            messageDiv.classList.add("admin-message");
          }

          messageDiv.innerHTML = `
  <div>
    ${msg.message}
  </div>

  <div class="message-time">

    ${new Date(msg.createdAt).toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit'
    })}

    ${
      msg.sender === "user"
      ? `
      <span class="message-status">
        ${msg.delivered ? "✓✓" : "✓"}
      </span>
      `
      : ""
    }

  </div>
`;

          chatBox.appendChild(messageDiv);

        });

        chatBox.scrollTop = chatBox.scrollHeight;

      } catch (error) {

        console.error(error);

      }
    }


    // ========================================
    // ENTER KEY SEND
    // ========================================

    messageInput.addEventListener("keypress", function(e) {

      if (e.key === "Enter") {
        sendMessage();
      }

    });


    // ========================================
    // AUTO REFRESH CHAT
    // ========================================

    loadMessages();

    setInterval(loadMessages, 3000);

  </script>

</body>
</html>
